# Render Blueprint: deploys the FastAPI backend on the free plan.
# Render dashboard → New → Blueprint → pick this repo. Secrets (sync: false) are entered in the dashboard, never committed.
services:
  - type: web
    name: veritas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: openai_compat
      - key: OPENAI_COMPAT_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      - key: OPENAI_COMPAT_MODEL
        sync: false
      - key: ENABLE_LIVE_URL_CHECKS
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/veritas.db
      - key: RATE_LIMIT_PER_WINDOW
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"
